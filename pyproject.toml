[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "microllama-v2"
version = "0.1.0"
description = "388M Qwen3/Engram pretraining with CUDA and experimental MLX"
requires-python = ">=3.11"
dependencies = [
  "huggingface-hub>=0.34,<2", "tokenizers>=0.21,<1",
  "numpy>=1.26,<3", "pyarrow>=19,<24", "safetensors>=0.5,<1"
]

[project.optional-dependencies]
torch = ["torch>=2.5,<3", "transformers==4.57.6"]
dev = ["pytest>=8,<10"]
tracking = ["wandb==0.19.5"]

mac = [
  "torch==2.9.1", "transformers==4.57.6", "wandb==0.22.3",
  "mlx==0.32.4; platform_system == 'Darwin' and platform_machine == 'arm64'",
  "mlx-metal==0.32.4; platform_system == 'Darwin' and platform_machine == 'arm64'"
]

[tool.setuptools.packages.find]
include = ["microllama*"]

[tool.setuptools.package-data]
"microllama.training.vendor.muon" = ["LICENSE", "source.json"]
"microllama.training" = ["metal/*.h", "metal/*.metal", "metal/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
