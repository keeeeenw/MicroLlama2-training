[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "microllama-v2"
version = "0.1.0"
description = "388M Qwen3/Engram NVIDIA pretraining implementation"
requires-python = ">=3.11"
dependencies = [
  "huggingface-hub>=0.34,<2", "tokenizers>=0.21,<1",
  "numpy>=1.26,<3", "pyarrow>=19,<24", "safetensors>=0.5,<1"
]

[project.optional-dependencies]
torch = ["torch>=2.5,<3", "transformers==4.57.6"]
dev = ["pytest>=8,<10"]
tracking = ["wandb==0.19.5"]

[tool.setuptools.packages.find]
include = ["microllama*"]

[tool.setuptools.package-data]
"microllama.training.vendor.muon" = ["LICENSE", "source.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
