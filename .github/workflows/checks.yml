name: CPU checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU test environment
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.57.6 huggingface-hub==0.36.2 tokenizers==0.22.2 numpy==1.26.4 pyarrow==19.0.0 safetensors==0.5.2 pytest==8.3.4 wandb==0.19.5
          python -m pip install --no-deps -e .
      - name: CPU fixtures and offline quickstart checks
        env:
          OMP_NUM_THREADS: '2'
          WANDB_MODE: offline
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: python -m pytest -q
